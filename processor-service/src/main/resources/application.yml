server:
  port: 8081

spring:
  application:
    name: processor-service

  datasource:
    url: jdbc:postgresql://localhost:5432/webhookdb
    username: webhook
    password: webhook
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: webhook-processor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.backendbrilliance.common.dto"
        spring.json.value.default.type: "org.backendbrilliance.common.dto.WebhookEventDto"
    listener:
      ack-mode: manual_immediate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

alerts:
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  inactivity-threshold-hours: 2

logging:
  level:
    dev.webhookdebugger: DEBUG
    org.springframework.kafka: INFO
    org.flywaydb: INFO