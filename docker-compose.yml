version: '3.8'

services:

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "Mk3OEYBSD38oCxb1zE5LjA"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: webhookdb
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhookdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  capture-service:
    build:
      context: ./capture-service
      dockerfile: Dockerfile
    container_name: capture-service
    ports:
      - "8080:8080"
    environment:
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  processor-service:
    build:
      context: ./processor-service
      dockerfile: Dockerfile
    container_name: processor-service
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhookdb
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ui-service:
    build:
      context: ./ui-service
      dockerfile: Dockerfile
    container_name: ui-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhookdb
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka_data:
  pgdata: