events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=capture:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=ui:10m rate=60r/m;

    server {
        listen 80;
        server_name _;

        # Landing page — static HTML
        location = / {
            root /var/www/landing;
            try_files /index.html =404;
        }

        # Webhook capture
        location /h/ {
            limit_req zone=capture burst=10 nodelay;
            proxy_pass http://capture-service:8080;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Payment callback from Razorpay JS
        location /api/ {
            proxy_pass http://ui-service:8082;
            proxy_set_header Host $host;
        }

        # Vaadin app — login, register, dashboard
        location / {
            limit_req zone=ui burst=20 nodelay;
            proxy_pass http://ui-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
        }
    }
}