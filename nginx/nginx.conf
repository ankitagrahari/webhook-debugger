events { worker_connections 1024; }

http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;

  upstream ui       { server ui-service:8082; }
  upstream capture  { server capture-service:8080; }

  server {
    listen 80;
    server_name hookspy.dev www.hookspy.dev;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name hookspy.dev www.hookspy.dev;

    ssl_certificate     /etc/letsencrypt/live/hookspy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hookspy.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Rate limit registration
    location = /api/auth/register {
      limit_req zone=register burst=3 nodelay;
      proxy_pass http://ui;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SSE streams — disable buffering, keep connection alive
    location ~ ^/api/endpoints/.*/requests/stream$ {
      proxy_pass http://ui;
      proxy_http_version 1.1;
      proxy_set_header Connection '';           # disable keep-alive chunking
      proxy_buffering off;                      # critical for SSE
      proxy_cache off;
      proxy_read_timeout 24h;                   # hold SSE connection open
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      add_header X-Accel-Buffering no;
      add_header Cache-Control no-cache;
    }

    # Webhook capture — direct to capture-service
    location /h/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://capture;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # All other API + React app
    location / {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://ui;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}