server:
  port: 8082
  tomcat:
    connection-timeout: -1

spring:
  main:
    web-application-type: servlet
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.reactive.ReactiveWebServerFactoryAutoConfiguration
      - org.springframework.boot.autoconfigure.reactor.ReactorAutoConfiguration

  application:
    name: ui-service
  mvc:
    async:
      request-timeout: -1

  datasource:
    url: jdbc:postgresql://localhost:5432/webhookdb
    username: webhook
    password: webhook
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  vaadin:
    launch-browser: false
    whitelisted-packages: com.vaadin,org.vaadin,dev.webhookdebugger.ui

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: "change-this-to-a-256-bit-secret-before-deploying-to-production"
  expiry-ms: 86400000

capture:
  baseurl: https://hookspy.in

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    dev.webhookdebugger: DEBUG